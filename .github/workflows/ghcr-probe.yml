name: GHCR probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push candidate package names
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -uo pipefail
          printf 'FROM alpine:3.20\n' > /tmp/Dockerfile.probe
          for NAME in axonhub axonhub-mini-image axonhub-mini; do
            echo "=== pushing ghcr.io/powerdi/$NAME:probe ==="
            docker build -q -t "ghcr.io/powerdi/$NAME:probe" -f /tmp/Dockerfile.probe /tmp >/dev/null
            if docker push "ghcr.io/powerdi/$NAME:probe" 2>&1 | tail -2; then
              echo "RESULT $NAME = ok"
            else
              echo "RESULT $NAME = failed"
            fi
          done
