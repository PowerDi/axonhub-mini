name: Publish Docker image (GHCR)

# Fork-owned image build. Runs only when triggered by hand, so pushing to main
# does not spend runner minutes on a Docker build. Publishes to GHCR under this
# repository's owner using the built-in GITHUB_TOKEN, so no registry secret is
# required.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        default: amd64
        options:
          - amd64
          - arm64
          - both
      ref:
        description: Branch, tag or commit to build
        type: string
        default: main
      extra_tag:
        description: Optional additional tag (e.g. prod, 20260824)
        type: string
        default: ''

jobs:
  prepare:
    name: Pin commit & plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      image: ${{ steps.plan.outputs.image }}
      commit_sha: ${{ steps.plan.outputs.commit_sha }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
      base_version: ${{ steps.plan.outputs.base_version }}
      mini_version: ${{ steps.plan.outputs.mini_version }}
      version: ${{ steps.plan.outputs.version }}
      pinned_tag: ${{ steps.plan.outputs.pinned_tag }}
      moving_tags: ${{ steps.plan.outputs.moving_tags }}
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Plan build
        id: plan
        env:
          ARCH: ${{ inputs.arch }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: axonhub-mini
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          case "$ARCH" in
            amd64)
              MATRIX='[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]'
              ;;
            arm64)
              MATRIX='[{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
              ;;
            both)
              MATRIX='[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
              ;;
            *)
              echo "Unsupported arch: $ARCH" >&2
              exit 1
              ;;
          esac

          # GHCR rejects uppercase characters in a package path.
          IMAGE="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/${PACKAGE}"

          # internal/build/VERSION only moves when upstream cuts a release
          # (release.yml writes the pushed v* tag into it), so it cannot on its
          # own distinguish two of our builds. It is the *base* here, never the
          # whole version.
          SEMVER_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'

          BASE_VERSION=$(tr -d '[:space:]' < internal/build/VERSION)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=v0.0.0
          fi
          if ! printf '%s\n' "$BASE_VERSION" | grep -Eq "$SEMVER_RE"; then
            echo "internal/build/VERSION is not semver: $BASE_VERSION" >&2
            exit 1
          fi

          # Our own release counter, bumped by hand in .github/mini-version.txt
          # when cutting a release -- same discipline as upstream, which bumps
          # its VERSION by hand too. Independent of upstream's release cadence.
          MINI_FILE=.github/mini-version.txt
          if [ ! -f "$MINI_FILE" ]; then
            echo "missing $MINI_FILE" >&2
            exit 1
          fi
          MINI=$(tr -d '[:space:]' < "$MINI_FILE")
          if ! printf '%s\n' "$MINI" | grep -Eq '^(0|[1-9][0-9]*)$'; then
            echo "$MINI_FILE must hold a plain non-negative integer, got: $MINI" >&2
            exit 1
          fi

          # Tag scheme. The counter goes in its own dot-separated prerelease
          # identifier so semver compares it numerically -- glued into one
          # identifier ("mini9" vs "mini10") it degrades to a string compare
          # and 10 sorts below 9.
          #
          #   ref = v* git tag        -> :v1.2.3                       + :latest
          #   ref = main, base beta   -> :v1.2.3-beta8.mini.<n>        + :latest
          #   ref = main, base stable -> :v1.2.4-mini.<n>              + :latest
          #   ref = other branch      -> :<as above>.<slug>           + :<slug>
          #
          # The version tag doubles as build.Version, so the running server
          # reports exactly the tag it was deployed from.
          case "$REF" in
            v[0-9]*)
              # Building an explicit tag: honour it verbatim, no suffix.
              VERSION="$REF"
              MOVING="latest"
              ;;
            *)
              case "$BASE_VERSION" in
                *-*)
                  # Base is a prerelease (v1.0.0-beta8): append to the existing
                  # prerelease so the build stays above beta8 and below beta9.
                  VERSION="${BASE_VERSION}.mini.${MINI}"
                  ;;
                *)
                  # Base is a finished release (v1.2.3). A prerelease of the
                  # same version sorts *below* it, which would make our build
                  # look older than the release it contains, so bump the patch
                  # and pre-release that instead: v1.2.3 < v1.2.4-mini.N < v1.2.4
                  STRIPPED="${BASE_VERSION#v}"
                  MAJOR="${STRIPPED%%.*}"
                  REST="${STRIPPED#*.}"
                  MINOR="${REST%%.*}"
                  PATCH="${REST#*.}"
                  VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))-mini.${MINI}"
                  ;;
              esac

              if [ "$REF" != "main" ]; then
                # Restricted to semver prerelease characters: underscores and
                # other separators are not allowed there, so they collapse to a
                # dash.
                SLUG=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9-' '-' | sed -E 's/-+/-/g; s/^-+//; s/-+$//' | cut -c1-32)
                if [ -z "$SLUG" ]; then
                  SLUG=build
                fi
                VERSION="${VERSION}.${SLUG}"
                # A one-off build from another branch must not move :latest.
                MOVING="$SLUG"
              else
                MOVING="latest"
              fi
              ;;
          esac

          # Keep the result parseable by Masterminds/semver: internal/ent/migrate
          # /datamigrate/migrator.go parses build.Version and skips the system
          # version update when it is invalid.
          if ! printf '%s\n' "$VERSION" | grep -Eq "$SEMVER_RE"; then
            echo "Refusing to build with non-semver version: $VERSION" >&2
            exit 1
          fi

          printf 'base %s + mini %s -> %s (moving: %s)\n' \
            "$BASE_VERSION" "$MINI" "$VERSION" "$MOVING"

          {
            printf 'matrix=%s\n' "$MATRIX"
            printf 'image=%s\n' "$IMAGE"
            printf 'pinned_tag=%s\n' "$VERSION"
            printf 'moving_tags=%s\n' "$MOVING"
            printf 'commit_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'short_sha=%s\n' "$(git rev-parse --short=7 HEAD)"
            printf 'base_version=%s\n' "$BASE_VERSION"
            printf 'mini_version=%s\n' "$MINI"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out pinned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Write VERSION
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '%s\n' "$VERSION" > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}

      - name: Build & push single-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.pinned_tag }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

  create_manifest:
    name: Create manifest
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          ARCH_INPUT: ${{ inputs.arch }}
          PINNED: ${{ needs.prepare.outputs.pinned_tag }}
          MOVING: ${{ needs.prepare.outputs.moving_tags }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          set -euo pipefail

          if [ "$ARCH_INPUT" = "both" ]; then
            ARCHES="amd64 arm64"
          else
            ARCHES="$ARCH_INPUT"
          fi

          SOURCES=""
          for arch in $ARCHES; do
            SOURCES="$SOURCES ${IMAGE}:${PINNED}-${arch}"
          done

          # Both tags are repointed by a rebuild: PINNED only carries a date, so
          # a second build on the same day reuses it. Deployments that need a
          # guaranteed-identical image should pin the digest, not the tag.
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "${IMAGE}:${PINNED}" -t "${IMAGE}:${MOVING}" $SOURCES

          if [ -n "$EXTRA_TAG" ]; then
            if ! printf '%s\n' "$EXTRA_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'; then
              echo "Invalid extra tag: $EXTRA_TAG" >&2
              exit 1
            fi
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "${IMAGE}:${EXTRA_TAG}" $SOURCES
          fi

      - name: Summary
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          PINNED: ${{ needs.prepare.outputs.pinned_tag }}
          MOVING: ${{ needs.prepare.outputs.moving_tags }}
          SHA: ${{ needs.prepare.outputs.short_sha }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          # Keep the leading dash inside the argument: a format string that
          # starts with "-" is parsed as an option by bash's printf builtin.
          {
            printf '### Pushed images\n\n'
            printf '%s\n' "- \`${IMAGE}:${PINNED}\` (version tag)"
            printf '%s\n' "- \`${IMAGE}:${MOVING}\` (rolling)"
            if [ -n "$EXTRA_TAG" ]; then
              printf '%s\n' "- \`${IMAGE}:${EXTRA_TAG}\`"
            fi
            printf '\nBuild version: `%s`\n' "$PINNED"
            printf 'Commit: `%s`\n' "$SHA"
          } >> "$GITHUB_STEP_SUMMARY"
