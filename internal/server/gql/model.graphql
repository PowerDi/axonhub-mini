# ModelCard represents model capabilities and metadata
type ModelCard {
  reasoning: ModelCardReasoning!
  toolCall: Boolean!
  temperature: Boolean!
  modalities: ModelCardModalities!
  vision: Boolean
  cost: ModelCardCost!
  limit: ModelCardLimit!
  knowledge: String
  releaseDate: String
  lastUpdated: String
}

type ModelCardReasoning {
  supported: Boolean!
  default: Boolean!
}

type ModelCardModalities {
  input: [String!]!
  output: [String!]!
}

type ModelCardCost {
  input: Float!
  output: Float!
  cacheRead: Float!
  cacheWrite: Float!
}

type ModelCardLimit {
  context: Int!
  output: Int!
}

# ModelSettings represents model Association configuration
type ModelSettings {
  disableDeveloperSettingsInheritance: Boolean!
  associations: [ModelAssociation!]!
  loadBalancerStrategy: String!
  traceStickyMode: String!
}

type ModelAssociation {
  type: String!
  priority: Int!
  disabled: Boolean!
  when: ModelAssociationWhen
  channelModel: ChannelModelAssociation
  channelRegex: ChannelRegexAssociation
  regex: RegexAssociation
  modelId: ModelIDAssociation
  channelTagsModel: ChannelTagsModelAssociation
  channelTagsRegex: ChannelTagsRegexAssociation
}

type ModelAssociationWhen {
  enabled: Boolean!
  condition: FilterCondition
}

type ChannelModelAssociation {
  channelId: Int!
  modelId: String!
}

type ChannelRegexAssociation {
  channelId: Int!
  pattern: String!
}

type RegexAssociation {
  pattern: String!
  exclude: [ExcludeAssociation!]
}

type ModelIDAssociation {
  modelId: String!
  exclude: [ExcludeAssociation!]
}

type ExcludeAssociation {
  channelNamePattern: String
  channelIds: [Int!]
  channelTags: [String!]
}

type ChannelTagsModelAssociation {
  channelTags: [String!]!
  modelId: String!
}

type ChannelTagsRegexAssociation {
  channelTags: [String!]!
  pattern: String!
}

# Input types for mutations
input ModelCardInput {
  reasoning: ModelCardReasoningInput
  toolCall: Boolean
  temperature: Boolean
  modalities: ModelCardModalitiesInput
  vision: Boolean
  cost: ModelCardCostInput
  limit: ModelCardLimitInput
  knowledge: String
  releaseDate: String
  lastUpdated: String
}

input ModelCardReasoningInput {
  supported: Boolean
  default: Boolean
}

input ModelCardModalitiesInput {
  input: [String!]
  output: [String!]
}

input ModelCardCostInput {
  input: Float
  output: Float
  cacheRead: Float
  cacheWrite: Float
}

input ModelCardLimitInput {
  context: Int
  output: Int
}

input ModelSettingsInput {
  disableDeveloperSettingsInheritance: Boolean
  associations: [ModelAssociationInput!]!
  loadBalancerStrategy: String
  traceStickyMode: String
}

input ModelAssociationInput {
  type: String!
  priority: Int
  disabled: Boolean
  when: ModelAssociationWhenInput
  channelModel: ChannelModelAssociationInput
  channelRegex: ChannelRegexAssociationInput
  regex: RegexAssociationInput
  modelId: ModelIDAssociationInput
  channelTagsModel: ChannelTagsModelAssociationInput
  channelTagsRegex: ChannelTagsRegexAssociationInput
}

input ModelAssociationWhenInput {
  enabled: Boolean
  condition: FilterConditionInput
}

input ChannelModelAssociationInput {
  channelId: Int!
  modelId: String!
}

input ChannelRegexAssociationInput {
  channelId: Int!
  pattern: String!
}

input RegexAssociationInput {
  pattern: String!
  exclude: [ExcludeAssociationInput!]
}

input ModelIDAssociationInput {
  modelId: String!
  exclude: [ExcludeAssociationInput!]
}

input ExcludeAssociationInput {
  channelNamePattern: String
  channelIds: [Int!]
  channelTags: [String!]
}

input ChannelTagsModelAssociationInput {
  channelTags: [String!]!
  modelId: String!
}

input ChannelTagsRegexAssociationInput {
  channelTags: [String!]!
  pattern: String!
}

# One upstream (channel, model) pair to wire into a Model. upstreamModelId is the
# name the channel answers to, so it must be one of the channel's model entries.
input ImportModelSource {
  channelId: Int!
  upstreamModelId: String!
}

# The Model fields the unassociated-channel list cannot supply. The client fills
# them from providers.json, falling back to placeholders when there is no match.
input ImportModelMetadata {
  modelId: String!
  developer: String!
  type: ModelType
  name: String!
  icon: String!
  group: String!
  modelCard: ModelCardInput
  remark: String
}

# Imports one target Model. Set targetModelId to append associations to an
# existing Model, or metadata to create a new one — exactly one of the two.
input ImportUnassociatedModelItem {
  targetModelId: Int
  metadata: ImportModelMetadata
  sources: [ImportModelSource!]!
}

type ImportUnassociatedModelsResult {
  created: Int!
  appended: Int!
  models: [Model!]!
  warnings: [String!]!
}

type ModelChannelConnection {
  channel: Channel!
  models: [ChannelModelEntry!]!
  priority: Int!
}

type ChannelModelEntry {
  requestModel: String!
  actualModel: String!
  source: String!
}

type UnassociatedChannel {
  channel: Channel!
  models: [String!]!
}

extend type Model {
  associatedChannelCount: Int! @goField(forceResolver: true)
}

extend type Query {
  fetchModels(input: FetchModelsInput!): FetchModelsPayload!
  queryModels(input: QueryModelsInput!): [ModelIdentityWithStatus!]!
  queryModelChannelConnections(
    associations: [ModelAssociationInput!]!
  ): [ModelChannelConnection!]!
  queryUnassociatedChannels: [UnassociatedChannel!]!
}

extend type Mutation {
  createModel(input: CreateModelInput!): Model!
  bulkCreateModels(inputs: [CreateModelInput!]!): [Model!]!
  updateModel(id: ID!, input: UpdateModelInput!): Model!
  deleteModel(id: ID!): Boolean!
  updateModelStatus(id: ID!, status: ModelStatus!): Boolean!
  bulkArchiveModels(ids: [ID!]!): Boolean!
  bulkDisableModels(ids: [ID!]!): Boolean!
  bulkEnableModels(ids: [ID!]!): Boolean!
  bulkDeleteModels(ids: [ID!]!): Boolean!
  importUnassociatedModels(
    items: [ImportUnassociatedModelItem!]!
  ): ImportUnassociatedModelsResult!
}
